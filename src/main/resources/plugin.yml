name: Consecuencias
version: '${project.version}'
main: com.etheria.consecuencias.ConsecuenciasPlugin
api-version: '1.21'
authors: [Etheria]
description: Desastres y consecuencias para el servidor - sequías, meteoritos, terremotos, plagas y más, con menú de administración.
softdepend: [GremiosGUI]

commands:
  desastre:
    description: Menú y comandos de desastres.
    aliases: [desastres, consecuencias, cons]
    usage: /desastre [menu|iniciar|parar|lista|auto|zonasegura|recargar]

permissions:
  consecuencias.admin:
    description: Activar y detener desastres.
    default: op
  consecuencias.inmune:
    description: No sufre los efectos de los desastres.
    default: false
