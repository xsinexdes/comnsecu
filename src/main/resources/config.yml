# ════════════════════════════════════════════════════════════════
#  CONSECUENCIAS — desastres para tu servidor
#  Comandos: /desastre  (menú)   /desastre iniciar <id> [min] [nivel] [mundo]
# ════════════════════════════════════════════════════════════════

# Mundos donde pueden ocurrir (vacío = todos los mundos normales, no Nether/End)
mundos: []

# ¿Pueden los desastres modificar bloques (agua que se seca, cráteres, hoyos, incendios…)?
# Todo lo que se modifica se apunta y se REPARA solo al terminar. false = solo efectos y daño, sin tocar bloques.
destruccion: true
regenerar: true
regenerar-segundos: 20      # cuánto tarda en empezar a reparar tras acabar el desastre
regenerar-velocidad: 120    # bloques reparados cada 0,5 s
limite-bloques: 60000       # tope de bloques apuntados a la vez (protege el servidor)

# Protección: ningún desastre toca bloques cerca del spawn ni en estas zonas (/desastre zonasegura <radio> estando en tu territorio)
zona-spawn-protegida: 30
zonas-seguras: []

# Segundos de aviso antes de que empiece (chat grande + título + sonido + barra)
aviso-segundos: 15
anuncios:
  chat: true
  titulo: true
  bossbar: true
  sonido: true
  final: true               # anuncia cuando termina

# Aviso a Discord (opcional): pega aquí la URL del webhook
discord:
  webhook: ""

# Modo automático: lanza desastres aleatorios solos (se activa también desde el menú)
auto:
  activo: false
  minimo-minutos: 45
  maximo-minutos: 120
  jugadores-minimos: 1
  max-simultaneos: 2
  horario:                  # solo lanzar desastres automáticos en esta franja (hora del servidor)
    activo: false
    desde: 17
    hasta: 23

# Cadenas: al terminar un desastre puede desencadenar otro (consecuencias de las consecuencias).
# probabilidad = %, retraso-segundos = espera antes del siguiente. Mismo mundo y misma intensidad.
cadenas:
  activo: true
  reglas:
    - {origen: sequia, destino: incendio, probabilidad: 30, retraso-segundos: 60}
    - {origen: ola_calor, destino: incendio, probabilidad: 35, retraso-segundos: 90}
    - {origen: tormenta_electrica, destino: incendio, probabilidad: 25, retraso-segundos: 30}
    - {origen: meteoritos, destino: incendio, probabilidad: 30, retraso-segundos: 20}
    - {origen: terremoto, destino: derrumbe, probabilidad: 60, retraso-segundos: 5}
    - {origen: terremoto, destino: sumidero, probabilidad: 25, retraso-segundos: 20}
    - {origen: erupcion, destino: incendio, probabilidad: 40, retraso-segundos: 15}
    - {origen: erupcion, destino: lluvia_acida, probabilidad: 40, retraso-segundos: 30}
    - {origen: diluvio, destino: inundacion, probabilidad: 45, retraso-segundos: 60}
    - {origen: huracan, destino: inundacion, probabilidad: 40, retraso-segundos: 45}
    - {origen: peste, destino: hambruna, probabilidad: 30, retraso-segundos: 60}
    - {origen: hambruna, destino: peste, probabilidad: 20, retraso-segundos: 90}
    - {origen: gas_venenoso, destino: grisu, probabilidad: 30, retraso-segundos: 30}
    - {origen: eclipse, destino: invasion_zombi, probabilidad: 35, retraso-segundos: 20}
    - {origen: ventisca, destino: hambruna, probabilidad: 25, retraso-segundos: 60}

# Recompensa para quien aguanta un desastre entero sin morir (no se aplica a las bendiciones)
recompensas:
  xp: 40                    # XP por nivel de intensidad (se multiplica por el nivel)
  comandos: []              # comandos de consola extra. Variables: {jugador} {desastre} {nivel}
  #  - "eco give {jugador} 100"

# Equipo anti-desastres (máscara antigás, abrigo térmico, antídoto). Recetas en /desastre receta
equipo:
  recetas: true

# Disparadores: lanzar un desastre cuando OTRO plugin avisa de algo (por ejemplo GremiosGUI).
# Quita el # para usarlos. Requiere reiniciar el servidor.
#   evento:    clase del evento de Bukkit
#   condicion: método=valor (opcional). Se llama al método del evento y se compara con el valor
disparadores: []
#  - evento: com.etheria.gremios.api.event.EventResultEvent     # un evento KOTH/jefe terminó
#    condicion: "isWon=false"                                   # ...y nadie lo ganó
#    desastre: terremoto
#    minutos: 3
#    nivel: 2
#    mundo: world
#  - evento: com.etheria.gremios.api.event.TerritoryCaptureEvent  # alguien conquistó un territorio
#    desastre: meteoritos
#    nivel: 1
#
# --- CONSECUENCIAS QUE SE QUEDAN (permanentes) ---
# Un disparador puede activar una maldición PERMANENTE (permanente: id, dias: 0 = para siempre),
# lanzar un desastre como CICATRIZ (cicatriz: true -> el terreno NO se repara) o levantar una maldición cuando ganan.
# ids de permanentes: /desastre permanente lista
#  - evento: com.etheria.gremios.api.event.EventResultEvent     # si pierden el evento...
#    condicion: "isWon=false"
#    permanente: noche_eterna                                   # ...la noche eterna se queda
#    dias: 3                                                    # (0 = hasta que la levantes tú)
#    desastre: meteoritos                                       # (opcional) además, lluvia de meteoritos
#    cicatriz: true                                             # que deja cráteres para siempre
#  - evento: com.etheria.gremios.api.event.EventResultEvent     # si lo ganan, se levanta
#    condicion: "isWon=true"
#    quitar-permanente: noche_eterna

# Cada desastre: activo (puede salir solo), minutos (duración), peso (probabilidad en modo automático)
desastres:
  sequia:
    activo: true
    minutos: 10
    peso: 10
    radio: 40              # radio alrededor de cada jugador donde se evapora el agua
   # Sequía
  inundacion: {activo: true, minutos: 8, peso: 7}   # Inundación
  diluvio: {activo: true, minutos: 8, peso: 10}   # Diluvio
  lluvia_acida: {activo: true, minutos: 8, peso: 10}   # Lluvia ácida
  tormenta_electrica: {activo: true, minutos: 6, peso: 10}   # Tormenta eléctrica
  huracan: {activo: true, minutos: 6, peso: 10}   # Huracán
  tornado: {activo: true, minutos: 5, peso: 6}   # Tornado
  granizo: {activo: true, minutos: 5, peso: 10}   # Granizo
  ola_calor: {activo: true, minutos: 8, peso: 10}   # Ola de calor
  ventisca: {activo: true, minutos: 8, peso: 10}   # Ventisca
  niebla: {activo: true, minutos: 8, peso: 10}   # Niebla espesa
  tormenta_arena: {activo: true, minutos: 5, peso: 10}   # Tormenta de arena
  terremoto: {activo: true, minutos: 3, peso: 6}   # Terremoto
  sumidero: {activo: true, minutos: 3, peso: 5}   # Sumidero
  derrumbe: {activo: true, minutos: 6, peso: 10}   # Derrumbes
  erupcion: {activo: true, minutos: 5, peso: 4}   # Erupción volcánica
  incendio: {activo: true, minutos: 6, peso: 7}   # Incendio forestal
  meteoritos:
    activo: true
    minutos: 6
    peso: 6
    # botín de cada impacto: MATERIAL:mínimo:máximo:peso
    botin:
      - IRON_INGOT:2:6:40
      - COPPER_INGOT:3:8:30
      - GOLD_INGOT:1:4:25
      - AMETHYST_SHARD:2:6:20
      - EXPERIENCE_BOTTLE:2:5:20
      - OBSIDIAN:1:3:15
      - DIAMOND:1:2:8
      - NETHERITE_SCRAP:1:1:2
   # Lluvia de meteoritos
  lluvia_fuego: {activo: true, minutos: 4, peso: 5}   # Lluvia de fuego
  eclipse: {activo: true, minutos: 6, peso: 6}   # Eclipse total
  luna_sangre:
    activo: true
    minutos: 8
    peso: 6
    botin: [GOLD_NUGGET, IRON_INGOT, EMERALD, DIAMOND, ENDER_PEARL]
   # Luna de sangre
  gravedad: {activo: true, minutos: 4, peso: 10}   # Gravedad lunar
  gas_venenoso: {activo: true, minutos: 8, peso: 7}   # Gas venenoso en cuevas
  grisu: {activo: true, minutos: 6, peso: 6}   # Grisú explosivo
  infestacion: {activo: true, minutos: 6, peso: 7}   # Infestación subterránea
  peste: {activo: true, minutos: 10, peso: 6}   # Peste
  langostas: {activo: true, minutos: 6, peso: 10}   # Plaga de langostas
  hambruna: {activo: true, minutos: 12, peso: 10}   # Hambruna
  peste_ganado:
    activo: true
    minutos: 6
    peso: 10
    matar: true            # false = solo no se pueden criar
   # Peste ganadera
  invasion_zombi:
    activo: true
    minutos: 8
    peso: 6
    botin: [GOLD_INGOT, IRON_INGOT, EMERALD, GOLDEN_APPLE]
   # Invasión zombi
  desgarro: {activo: true, minutos: 6, peso: 5}   # Desgarro dimensional
  marea_toxica: {activo: true, minutos: 8, peso: 10}   # Marea tóxica
  tormenta_magnetica: {activo: true, minutos: 5, peso: 6}   # Tormenta magnética
  fantasmas: {activo: true, minutos: 6, peso: 6}   # Horda de fantasmas
  # ---- Bendiciones (eventos buenos; también salen en modo automático con su peso)
  cosecha_abundante: {activo: true, minutos: 8, peso: 5}   # Cosecha abundante
  aurora: {activo: true, minutos: 6, peso: 5}   # Aurora boreal
  lluvia_estrellas:
    activo: true
    minutos: 5
    peso: 5
    # botín de cada estrella: MATERIAL:mínimo:máximo
    botin:
      - GLOWSTONE_DUST:2:5
      - AMETHYST_SHARD:1:4
      - GOLD_NUGGET:3:8
      - EXPERIENCE_BOTTLE:1:3
      - LAPIS_LAZULI:2:6
      - DIAMOND:1:1
